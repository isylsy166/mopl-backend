services:
  mysql:
    image: mysql:8.0
    container_name: mopl-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mopl1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mopl-mysql-db}
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    volumes:
      - ./mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
